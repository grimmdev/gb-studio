name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version to package (e.g. v1.0.0; defaults to ref tag)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-web-package:
    name: Build Web Package & Assets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      clean_version: ${{ steps.version.outputs.clean_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Fetch Toolchains and Engine Dependencies
        run: |
          bun src/scripts/fetchDependencies.ts --all

      - name: Build Web Application
        run: |
          bun run build:web

      - name: Assemble Distribution Package
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PACKAGE_DIR="dist/package/gb-studio-web"
          mkdir -p "${PACKAGE_DIR}"

          # Copy built web application bundle and runtime files
          cp -r out/web "${PACKAGE_DIR}/out"
          cp -r src "${PACKAGE_DIR}/src"
          cp -r appData "${PACKAGE_DIR}/appData"
          cp -r buildTools "${PACKAGE_DIR}/buildTools"
          cp package.json bun.lock bunfig.toml docker-compose.yml Dockerfile README.md "${PACKAGE_DIR}/"

          # Add startup script for Linux / macOS
          cat << 'EOF' > "${PACKAGE_DIR}/start.sh"
          #!/bin/sh
          set -e
          PORT=${PORT:-3000}
          HOST=${HOST:-0.0.0.0}
          echo "Starting GB Studio Web on http://${HOST}:${PORT}..."
          bun run src/apps/gb-studio-web/server/index.ts "$@"
          EOF
          chmod +x "${PACKAGE_DIR}/start.sh"

          # Add startup script for Windows
          cat << 'EOF' > "${PACKAGE_DIR}/start.bat"
          @echo off
          set PORT=%PORT%
          if "%PORT%"=="" set PORT=3000
          set HOST=%HOST%
          if "%HOST%"=="" set HOST=0.0.0.0
          echo Starting GB Studio Web on http://%HOST%:%PORT%...
          bun run src/apps/gb-studio-web/server/index.ts %*
          EOF

          mkdir -p release-assets
          cd dist/package
          tar -czf "../../release-assets/gb-studio-web-${TAG}.tar.gz" gb-studio-web
          zip -qr "../../release-assets/gb-studio-web-${TAG}.zip" gb-studio-web
          cd ../..

          cd release-assets
          sha256sum gb-studio-web-${TAG}.tar.gz gb-studio-web-${TAG}.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Release Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          retention-days: 7

  build-and-push-docker:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: build-web-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU (multi-architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-web-package.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-web-package.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.build-web-package.outputs.tag }}
            type=raw,value=${{ needs.build-web-package.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.build-web-package.outputs.tag, '-alpha') && !contains(needs.build-web-package.outputs.tag, '-beta') && !contains(needs.build-web-package.outputs.tag, '-rc') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web-package, build-and-push-docker]

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-web-package.outputs.tag }}
          name: GB Studio Web ${{ needs.build-web-package.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.build-web-package.outputs.tag, '-alpha') || contains(needs.build-web-package.outputs.tag, '-beta') || contains(needs.build-web-package.outputs.tag, '-rc') }}
          generate_release_notes: true
          files: |
            release-assets/gb-studio-web-*.tar.gz
            release-assets/gb-studio-web-*.zip
            release-assets/SHA256SUMS.txt
          body: |
            ## 🎮 GB Studio Web Release (${{ needs.build-web-package.outputs.tag }})

            This release provides the containerized and standalone packages for the GB Studio Web & HTTP/WebSocket backend.

            ### 🐳 Run with Docker (GitHub Container Registry)
            ```bash
            # Pull and run directly from GHCR
            docker run -d \
              --name gb-studio-web \
              -p 3000:3000 \
              -v gb_studio_projects:/data/projects \
              ghcr.io/${{ github.repository }}:${{ needs.build-web-package.outputs.tag }}
            ```

            Or using `docker-compose`:
            ```bash
            docker compose up -d
            ```

            ### 📦 Standalone Package (Bun / Node)
            1. Download and extract `gb-studio-web-${{ needs.build-web-package.outputs.tag }}.zip` or `.tar.gz`.
            2. Install [Bun](https://bun.sh) if not already installed.
            3. Start the server:
               - **Linux/macOS:** `./start.sh`
               - **Windows:** `start.bat`
            4. Access the web interface at `http://localhost:3000`.
