name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - gbs-next
      - feat-*
      - beta-*
      - wip-*
      - fix-*

  workflow_dispatch:
    inputs:
      build_web:
        description: 'Build GB Studio Web package'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: |
          yarn

      - name: Test
        run: |
          yarn test

  deploy:
    needs: test
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/beta-') || startsWith(github.ref, 'refs/heads/feat-') || startsWith(github.ref, 'refs/heads/wip-') || startsWith(github.ref, 'refs/heads/fix-') || github.ref == 'refs/heads/gbs-next'

    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    strategy:
      matrix:
        include:
          - name: mac
            label: macOS ARM
            os: macos-14
          - name: mac-intel
            label: macOS Intel
            os: macos-14
          - name: win32
            label: Windows 32-bit
            os: ubuntu-latest
          - name: win64
            label: Windows 64-bit
            os: ubuntu-latest
          - name: linux
            label: Linux
            os: ubuntu-latest
          - name: linux-arm64
            label: Linux-arm64
            os: ubuntu-22.04-arm
          - name: web
            label: Web
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Notice macOS build skipped
        if: startsWith(matrix.name, 'mac') && env.MACOS_CERTIFICATE == ''
        run: echo "::notice ::Skipping macOS build because MACOS_CERTIFICATE secret is not configured."

      - name: Setup codesign certificate
        if: ((matrix.name == 'mac') || (matrix.name == 'mac-intel')) && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 -i - --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Install Dependencies
        if: (!startsWith(matrix.name, 'mac')) || env.MACOS_CERTIFICATE != ''
        run: |
          yarn

      - name: Update credits
        if: ${{ vars.FETCH_CREDITS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (!startsWith(matrix.name, 'mac') || env.MACOS_CERTIFICATE != '') }}
        env:
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
          PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
          CREDITS_GITHUB_ACCESS_TOKEN: ${{ secrets.CREDITS_GITHUB_ACCESS_TOKEN }}
        run: |
          npm run fetch-contributors
          npm run fetch-patrons

      # ==== Builds ====

      - name: Build Mac ARM
        if: matrix.name == 'mac' && env.MACOS_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
        run: |
          yarn fetch-deps -- --arch=darwin-arm64
          export APPLE_ID=${APPLE_ID}
          export APPLE_ID_PASSWORD=${APPLE_ID_PASSWORD}
          export APPLE_TEAM_ID=${APPLE_TEAM_ID}        
          yarn make:mac
          mkdir -p ./out/keep
          mv ./out/make/zip/darwin/arm64/*.zip ./out/keep/gb-studio-${GITHUB_REF##*/}-darwin_arm64.zip

      - name: Build Mac Intel
        if: matrix.name == 'mac-intel' && env.MACOS_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
        run: |
          yarn fetch-deps -- --arch=darwin-x64
          export APPLE_ID=${APPLE_ID}
          export APPLE_ID_PASSWORD=${APPLE_ID_PASSWORD}
          export APPLE_TEAM_ID=${APPLE_TEAM_ID}        
          yarn make:mac-intel
          mkdir -p ./out/keep
          mv ./out/make/zip/darwin/x64/*.zip ./out/keep/gb-studio-${GITHUB_REF##*/}-darwin_x64.zip

      - name: Build Linux
        if: matrix.name == 'linux'
        run: |
          yarn fetch-deps -- --arch=linux-x64
          yarn make:linux
          mkdir -p ./out/keep
          mv ./out/make/deb/x64/*.deb ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_x86_64.deb
          mv ./out/make/rpm/x64/*.rpm ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_x86_64.rpm
          mv ./out/make/AppImage/x64/*.AppImage ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_x86_64.AppImage

      - name: Build Linux arm64
        if: matrix.name == 'linux-arm64'
        run: |
          yarn fetch-deps -- --arch=linux-arm64  
          yarn make:linux-arm64
          mkdir -p ./out/keep
          mv ./out/make/deb/arm64/*.deb ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_arm64.deb
          mv ./out/make/rpm/arm64/*.rpm ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_arm64.rpm
          mv ./out/make/AppImage/arm64/*.AppImage ./out/keep/gb-studio-${GITHUB_REF##*/}-linux_arm64.AppImage

      - name: Build Win32
        if: matrix.name == 'win32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -y update
          sudo apt-get -y install wine wine64 mono-devel
          export PATH=$PATH:/usr/lib/wine
          yarn fetch-deps -- --arch=win32-ia32
          yarn make:win32
          mkdir -p ./out/keep
          mv ./out/make/zip/win32/ia32/*.zip ./out/keep/gb-studio-${CIRCLE_BRANCH}-windows_x86.zip
          mv ./out/make/squirrel.windows/ia32 ./out/keep/gb-studio-${CIRCLE_BRANCH}-windows_x86-squirrel

      - name: Build Win64
        if: matrix.name == 'win64'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -y update
          sudo apt-get -y install wine wine64 mono-devel
          export PATH=$PATH:/usr/lib/wine
          yarn fetch-deps -- --arch=win32-x64
          yarn make:win
          mkdir -p ./out/keep
          mv ./out/make/zip/win32/x64/*.zip ./out/keep/gb-studio-${CIRCLE_BRANCH}-windows_x86_64.zip
          mv ./out/make/squirrel.windows/x64 ./out/keep/gb-studio-${CIRCLE_BRANCH}-windows_x86_64-squirrel

      - name: Build Web
        if: matrix.name == 'web' && (github.event_name != 'workflow_dispatch' || inputs.build_web != false)
        run: |
          yarn fetch-deps -- --all
          yarn make:web
          mkdir -p ./out/keep
          PACKAGE_DIR="dist/package/gb-studio-web"
          mkdir -p "${PACKAGE_DIR}"
          cp -r out/web "${PACKAGE_DIR}/"
          cp -r appData "${PACKAGE_DIR}/appData"
          cp -r buildTools "${PACKAGE_DIR}/buildTools"
          cp package.json README.md "${PACKAGE_DIR}/"

          # Add startup script for Linux / macOS
          cat << 'EOF' > "${PACKAGE_DIR}/start.sh"
          #!/bin/sh
          set -e
          PORT=${PORT:-3000}
          HOST=${HOST:-0.0.0.0}
          echo "Starting GB Studio Web on http://${HOST}:${PORT}..."
          node out/web/server.js "$@"
          EOF
          chmod +x "${PACKAGE_DIR}/start.sh"

          # Add startup script for Windows
          cat << 'EOF' > "${PACKAGE_DIR}/start.bat"
          @echo off
          set PORT=%PORT%
          if "%PORT%"=="" set PORT=3000
          set HOST=%HOST%
          if "%HOST%"=="" set HOST=0.0.0.0
          echo Starting GB Studio Web on http://%HOST%:%PORT%...
          node out\web\server.js %*
          EOF

          cd dist/package
          tar -czf "../../out/keep/gb-studio-${GITHUB_REF##*/}-web.tar.gz" gb-studio-web
          zip -qr "../../out/keep/gb-studio-${GITHUB_REF##*/}-web.zip" gb-studio-web
          cd ../..

      - uses: actions/upload-artifact@v7
        if: (!startsWith(matrix.name, 'mac')) || env.MACOS_CERTIFICATE != ''
        with:
          name: ${{ matrix.label }} build
          path: |
            ./out/keep/**
