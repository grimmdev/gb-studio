name: Deploy Web to GitHub Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  deploy-web-package:
    name: Build & Deploy Web Image to GitHub Packages (GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag is on develop branch
        id: check_branch
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor "${{ github.sha }}" origin/develop; then
            echo "is_develop=true" >> $GITHUB_OUTPUT
            echo "Confirmed: Tag ${{ github.ref_name }} is on the develop branch."
          else
            echo "is_develop=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ github.ref_name }} is NOT on the develop branch. Skipping GitHub Packages deployment."
          fi

      - name: Set up QEMU (multi-architecture)
        if: steps.check_branch.outputs.is_develop == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_branch.outputs.is_develop == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_branch.outputs.is_develop == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        if: steps.check_branch.outputs.is_develop == 'true'
        id: repo_name
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        if: steps.check_branch.outputs.is_develop == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo_name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}

      - name: Build and push Docker image to GHCR
        if: steps.check_branch.outputs.is_develop == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
